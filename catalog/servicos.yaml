# Serviços do Windows.
category: Sistema/Serviços

tweaks:
  - id: services.windows-update.disable
    name: Desativar o Windows Update
    description: >
      Desativa os serviços do Windows Update e do Orquestrador de Atualizações e aplica a política
      que desliga as atualizações automáticas. O PC deixa de receber atualizações de segurança.
    risk: critical
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Update/AllowAutoUpdate" }
      - { kind: admx, ref: "WindowsUpdate.admx:AutoUpdateCfg" }
    tags: [windows-update, servico, seguranca]
    breaks: >
      Sem atualizações de segurança, de drivers e de definições do Defender; Microsoft Store e
      "Recursos sob demanda" podem falhar. O WaaSMedicSvc (serviço de correção) é protegido pelo
      sistema e pode recusar a alteração ou reativar os serviços.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: NoAutoUpdate
        kind: dword
        value: 1
      - type: service
        name: wuauserv
        startup: disabled
      - type: service
        name: UsoSvc
        startup: disabled
      - type: service
        name: WaaSMedicSvc
        startup: disabled

  - id: services.sysmain.disable
    name: Desativar o SysMain (Superfetch)
    description: Desativa o pré-carregamento de apps na memória. Pode ajudar em PCs com pouca RAM e uso de disco alto.
    risk: medium
    confidence: community
    tags: [servico, desempenho]
    breaks: Apps podem abrir mais devagar, especialmente em HDDs.
    actions:
      - type: service
        name: SysMain
        startup: disabled

  - id: services.windows-search.disable
    name: Desativar o Windows Search (indexação)
    description: Desativa o serviço de indexação de arquivos.
    risk: high
    confidence: community
    tags: [servico, pesquisa, desempenho]
    breaks: >
      Pesquisa no Iniciar e no Explorador fica muito mais lenta e incompleta; o Outlook e outros apps
      que dependem do índice deixam de pesquisar corretamente.
    actions:
      - type: service
        name: WSearch
        startup: disabled

  - id: services.print-spooler.disable
    name: Desativar o Spooler de Impressão
    description: Desativa o serviço de impressão. Reduz a superfície de ataque em PCs sem impressora.
    risk: high
    confidence: community
    tags: [servico, seguranca, impressao]
    breaks: Toda impressão, incluindo "Imprimir para PDF".
    actions:
      - type: service
        name: Spooler
        startup: disabled

  - id: services.xbox.disable
    name: Desativar serviços do Xbox
    description: Desativa autenticação, salvamento na nuvem e rede do Xbox Live.
    risk: medium
    confidence: community
    tags: [servico, xbox, jogos]
    breaks: App Xbox, Game Pass, salvamento na nuvem e conquistas de jogos.
    actions:
      - type: service
        name: XblAuthManager
        startup: disabled
      - type: service
        name: XblGameSave
        startup: disabled
      - type: service
        name: XboxNetApiSvc
        startup: disabled

  - id: services.fax.disable
    name: Desativar o serviço de Fax
    description: Desativa o serviço de Fax.
    risk: low
    confidence: community
    tags: [servico]
    breaks: Envio e recebimento de fax pelo Windows.
    actions:
      - type: service
        name: Fax
        startup: disabled

  - id: services.remote-registry.disable
    name: Desativar o Registro Remoto
    description: Garante que o registro não possa ser editado remotamente. Já vem desativado por padrão.
    risk: low
    confidence: community
    tags: [servico, seguranca]
    actions:
      - type: service
        name: RemoteRegistry
        startup: disabled

  - id: services.maps-broker.disable
    name: Desativar o Gerenciador de Mapas Baixados
    description: Desativa o serviço que atualiza mapas offline.
    risk: low
    confidence: community
    tags: [servico, mapas]
    breaks: Mapas offline do app Mapas.
    actions:
      - type: service
        name: MapsBroker
        startup: disabled

  - id: services.retail-demo.disable
    name: Desativar o serviço de demonstração de varejo
    description: Desativa o serviço do modo de demonstração em lojas.
    risk: low
    confidence: community
    tags: [servico]
    actions:
      - type: service
        name: RetailDemo
        startup: disabled
