# Anúncios, sugestões e conteúdo promocional.
category: Privacidade/Anúncios e sugestões

tweaks:
  - id: privacy.ads.advertising-id
    name: Desativar o ID de anúncio
    description: Impede que apps usem o ID de publicidade para mostrar anúncios personalizados.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Privacy/DisableAdvertisingId" }
      - { kind: admx, ref: "UserProfiles.admx:DisableAdvertisingId" }
    tags: [anuncios]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo
        name: Enabled
        kind: dword
        value: 0
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo
        name: DisabledByGroupPolicy
        kind: dword
        value: 1

  - id: privacy.ads.language-list
    name: Não expor a lista de idiomas aos sites
    description: Impede que sites acessem sua lista de idiomas para mostrar conteúdo local.
    risk: low
    confidence: community
    tags: [anuncios, web]
    actions:
      - type: registry
        path: HKCU\Control Panel\International\User Profile
        name: HttpAcceptLanguageOptOut
        kind: dword
        value: 1

  - id: privacy.ads.welcome-experience
    name: Desativar a "experiência de boas-vindas" após atualizações
    description: Não mostra a tela de novidades/boas-vindas do Windows após atualizações e ao entrar.
    risk: low
    confidence: community
    tags: [anuncios, content-delivery]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-310093Enabled
        kind: dword
        value: 0

  - id: privacy.ads.tips-suggestions
    name: Desativar dicas e sugestões do Windows
    description: Desativa "Obter dicas e sugestões ao usar o Windows" (notificações promocionais).
    risk: low
    confidence: community
    tags: [anuncios, content-delivery, notificacoes]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-338389Enabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SoftLandingEnabled
        kind: dword
        value: 0

  - id: privacy.ads.settings-suggestions
    name: Desativar conteúdo sugerido no app Configurações
    description: Remove as sugestões de conteúdo exibidas no app Configurações.
    risk: low
    confidence: community
    tags: [anuncios, content-delivery]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-338393Enabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-353694Enabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-353696Enabled
        kind: dword
        value: 0

  - id: privacy.ads.silent-app-install
    name: Impedir instalação silenciosa de apps sugeridos
    description: Impede que o Windows instale automaticamente apps patrocinados (Candy Crush etc.).
    risk: low
    confidence: community
    tags: [anuncios, content-delivery, bloatware]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SilentInstalledAppsEnabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: PreInstalledAppsEnabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: OemPreInstalledAppsEnabled
        kind: dword
        value: 0

  - id: privacy.ads.consumer-features
    name: Desativar "Experiências do consumidor da Microsoft"
    description: >
      Política que impede o Windows de baixar apps e conteúdo promocional para novos usuários.
      Oficialmente só é respeitada nas edições Enterprise/Education.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Experience/AllowWindowsConsumerFeatures" }
      - { kind: admx, ref: "CloudContent.admx:DisableWindowsConsumerFeatures" }
    tags: [anuncios, politica, bloatware]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: DisableWindowsConsumerFeatures
        kind: dword
        value: 1

  - id: privacy.ads.lock-screen-tips
    name: Desativar curiosidades e dicas na tela de bloqueio
    description: Remove "fatos divertidos, dicas e truques" e anúncios da tela de bloqueio.
    risk: low
    confidence: community
    tags: [anuncios, content-delivery, tela-de-bloqueio]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: RotatingLockScreenOverlayEnabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-338387Enabled
        kind: dword
        value: 0

  - id: privacy.ads.finish-setup-nag
    name: Não sugerir "concluir a configuração do dispositivo"
    description: Desativa a tela que sugere concluir a configuração (OneDrive, Microsoft 365, Game Pass...).
    risk: low
    confidence: community
    tags: [anuncios]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement
        name: ScoobeSystemSettingEnabled
        kind: dword
        value: 0

  - id: privacy.ads.start-recommendations
    name: Desativar recomendações de dicas e apps no Iniciar
    description: Desativa "Mostrar recomendações de dicas, atalhos, novos aplicativos e muito mais" no menu Iniciar.
    risk: low
    confidence: community
    minBuild: 22621
    tags: [anuncios, iniciar]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Start_IrisRecommendations
        kind: dword
        value: 0

  - id: privacy.ads.explorer-sync-provider
    name: Desativar notificações do provedor de sincronização no Explorador
    description: Remove os anúncios (OneDrive/Microsoft 365) exibidos no Explorador de Arquivos.
    risk: low
    confidence: community
    tags: [anuncios, explorer]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: ShowSyncProviderNotifications
        kind: dword
        value: 0

  - id: privacy.ads.start-suggestions
    name: Não mostrar sugestões de apps no Iniciar
    description: >
      Desliga "Mostrar sugestões ocasionalmente no Iniciar" (apps promovidos) e as sugestões do painel do
      sistema, dois conteúdos do Gerenciador de Entrega de Conteúdo.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winhance:start-suggestions" }
      - { kind: tool, ref: "win11debloat:Disable_Windows_Suggestions" }
    tags: [anuncios, iniciar, sugestoes]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContent-338388Enabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SystemPaneSuggestionsEnabled
        kind: dword
        value: 0

  - id: privacy.ads.content-delivery
    name: Desligar o Gerenciador de Entrega de Conteúdo
    description: >
      Desliga os interruptores gerais do Gerenciador de Entrega de Conteúdo (ContentDeliveryAllowed,
      SubscribedContentEnabled, FeatureManagementEnabled e PreInstalledAppsEverEnabled), que alimentam
      sugestões, apps promovidos, dicas e o Windows Spotlight.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winhance:content-delivery" }
      - { kind: tool, ref: "atlas:config-content-delivery" }
    tags: [anuncios, sugestoes]
    breaks: Windows Spotlight na tela de bloqueio e na área de trabalho (imagens do Bing) para de atualizar.
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: ContentDeliveryAllowed
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: SubscribedContentEnabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: FeatureManagementEnabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        name: PreInstalledAppsEverEnabled
        kind: dword
        value: 0

  - id: privacy.ads.account-notifications
    name: Não mostrar avisos da conta Microsoft no Iniciar e nas Configurações
    description: >
      Desliga as notificações da conta (ex.: "conclua o backup", "entre com a conta Microsoft") no menu do perfil
      do Iniciar e nas Configurações.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "sophia:AccountNotifications" }
      - { kind: tool, ref: "winhance:account-notifications" }
    tags: [anuncios, conta, iniciar]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Start_AccountNotifications
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications
        name: EnableAccountNotifications
        kind: dword
        value: 0

  - id: privacy.ads.windows-tips-policy
    name: Não mostrar dicas do Windows (política)
    description: >
      Política "Não mostrar dicas do Windows" (DisableSoftLanding), que vale para todos os usuários. A Policy CSP
      documenta essa política só para Enterprise/Education; no Pro/Home o efeito não é garantido (o ajuste do
      usuário privacy.ads.tips-suggestions continua valendo).
    risk: low
    confidence: official
    sources:
      - { kind: admx, ref: "CloudContent.admx:DisableSoftLanding" }
      - { kind: msdocs, ref: "Policy CSP - Experience/AllowWindowsTips" }
    tags: [anuncios, dicas, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: DisableSoftLanding
        kind: dword
        value: 1

  - id: privacy.ads.settings-account-content
    name: Não mostrar promoções da conta (Microsoft 365, OneDrive) nas Configurações
    description: >
      Política "Desativar conteúdo do estado da conta de consumidor na nuvem": a página Início das Configurações
      e outros lugares mostram o conteúdo padrão em vez de ofertas ligadas à conta Microsoft. A Policy CSP lista
      só Enterprise/Education; no Pro/Home o efeito não é garantido.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Experience/DisableConsumerAccountStateContent" }
      - { kind: admx, ref: "CloudContent.admx:DisableConsumerAccountStateContent" }
      - { kind: tool, ref: "win11debloat:Disable_Settings_365_Ads" }
    tags: [anuncios, configuracoes, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: DisableConsumerAccountStateContent
        kind: dword
        value: 1

  - id: privacy.ads.spotlight
    name: Desativar o Windows Spotlight (política do usuário)
    description: >
      Política "Desativar todos os recursos do Windows Spotlight" para o usuário atual: imagens, dicas e
      sugestões do Spotlight na tela de bloqueio, na área de trabalho e na Central de Ações. A Policy CSP lista
      só Enterprise/Education; no Pro/Home o efeito não é garantido (privacy.ads.content-delivery desliga o
      Spotlight pelas configurações do usuário).
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Experience/AllowWindowsSpotlight" }
      - { kind: admx, ref: "CloudContent.admx:DisableWindowsSpotlightFeatures" }
      - { kind: tool, ref: "atlas:cloud-content" }
    tags: [anuncios, spotlight, politica]
    breaks: As imagens do Spotlight deixam de aparecer; volte a escolher um papel de parede/imagem fixa.
    actions:
      - type: registry
        path: HKCU\Software\Policies\Microsoft\Windows\CloudContent
        name: DisableWindowsSpotlightFeatures
        kind: dword
        value: 1

  - id: privacy.ads.third-party-suggestions
    name: Não sugerir conteúdo de terceiros no Spotlight
    description: Política "Não sugerir conteúdo de terceiros no Windows Spotlight" (apps e conteúdo de outros editores).
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Experience/AllowThirdPartySuggestionsInWindowsSpotlight" }
      - { kind: admx, ref: "CloudContent.admx:DisableThirdPartySuggestions" }
    tags: [anuncios, spotlight, politica]
    actions:
      - type: registry
        path: HKCU\Software\Policies\Microsoft\Windows\CloudContent
        name: DisableThirdPartySuggestions
        kind: dword
        value: 1
