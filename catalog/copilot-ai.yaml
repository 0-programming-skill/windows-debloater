# Copilot, Recall and AI features.
category: AI/Copilot and Recall

tweaks:
  - id: ai.copilot.turn-off-policy
    name: Turn off Windows Copilot (policy)
    description: >
      Applies the "Turn off Windows Copilot" policy for the current user (the ADMX policy is User-only, in
      HKCU). Limited effect on current builds: Copilot became a Store app and the CSP policy is marked as
      deprecated. The effective approach is to remove the app (ai.copilot.remove-app); this policy only
      applies to the old Copilot built into Windows.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/TurnOffWindowsCopilot" }
      - { kind: admx, ref: "WindowsCopilot.admx:TurnOffWindowsCopilot" }
    tags: [copilot, ai, policy]
    i18n:
      pt-BR:
        name: Desativar o Windows Copilot (política)
        description: >
          Aplica a política "Desativar o Windows Copilot" para o usuário atual (a política ADMX é só de
          Usuário, em HKCU). Efeito limitado nos builds atuais: o Copilot virou um app da Store e a
          política da CSP está marcada como obsoleta. O caminho efetivo é remover o app
          (ai.copilot.remove-app); esta política serve só para o Copilot antigo integrado ao Windows.
    actions:
      - type: registry
        path: HKCU\Software\Policies\Microsoft\Windows\WindowsCopilot
        name: TurnOffWindowsCopilot
        kind: dword
        value: 1

  - id: ai.copilot.hide-taskbar-button
    name: Hide the Copilot button on the taskbar
    description: Removes the Copilot button from the taskbar.
    risk: low
    confidence: community
    tags: [copilot, ai, taskbar]
    i18n:
      pt-BR:
        name: Ocultar o botão do Copilot na barra de tarefas
        description: Remove o botão do Copilot da barra de tarefas.
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: ShowCopilotButton
        kind: dword
        value: 0

  - id: ai.copilot.remove-app
    name: Remove the Microsoft Copilot app
    description: Uninstalls the Copilot app for all users and prevents it from being reinstalled for new accounts.
    risk: low
    confidence: community
    reversible: false
    tags: [copilot, ai, appx]
    i18n:
      pt-BR:
        name: Remover o app Microsoft Copilot
        description: Desinstala o app Copilot para todos os usuários e impede sua reinstalação em novas contas.
    actions:
      - type: appx
        name: Microsoft.Copilot
        state: removed
        storeId: 9NHT9RB2F4HD

  - id: ai.recall.disable-snapshots
    name: Turn off Recall snapshots
    description: >
      Policy "Turn off saving snapshots for Windows" (DisableAIDataAnalysis): Recall stops capturing the
      screen. Only relevant on Copilot+ PCs.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/DisableAIDataAnalysis" }
      - { kind: admx, ref: "WindowsCopilot.admx:DisableAIDataAnalysis" }
    minBuild: 26100
    tags: [recall, ai, policy, privacy]
    references:
      - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowsai
    i18n:
      pt-BR:
        name: Desativar snapshots do Recall
        description: >
          Política "Desativar o salvamento de instantâneos para o Windows" (DisableAIDataAnalysis): o
          Recall deixa de capturar a tela. Relevante apenas em PCs Copilot+.
    actions:
      - type: registry
        path: HKCU\Software\Policies\Microsoft\Windows\WindowsAI
        name: DisableAIDataAnalysis
        kind: dword
        value: 1
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: DisableAIDataAnalysis
        kind: dword
        value: 1

  - id: ai.recall.disable-feature
    name: Turn off the Recall optional feature
    description: Turns off the Windows "Recall" optional component. Only exists on Copilot+ PCs.
    risk: medium
    confidence: community
    minBuild: 26100
    tags: [recall, ai, optional-feature]
    breaks: Recall and features that depend on it. Requires a restart.
    i18n:
      pt-BR:
        name: Desativar o recurso opcional Recall
        description: Desativa o componente opcional "Recall" do Windows. Só existe em PCs Copilot+.
        breaks: Recall e funções que dependem dele. Requer reinicialização.
    actions:
      - type: optionalFeature
        name: Recall
        state: disabled

  - id: ai.click-to-do.disable
    name: Turn off Click to Do
    description: Turns off "Click to Do", which analyzes screen content with AI, via policy.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/DisableClickToDo" }
      - { kind: admx, ref: "WindowsCopilot.admx:DisableClickToDo" }
    minBuild: 26100
    tags: [ai, policy]
    references:
      - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowsai
    i18n:
      pt-BR:
        name: Desativar o Clique para Fazer (Click to Do)
        description: Desativa por política o "Clique para Fazer", que analisa o conteúdo da tela com IA.
    actions:
      - type: registry
        path: HKCU\Software\Policies\Microsoft\Windows\WindowsAI
        name: DisableClickToDo
        kind: dword
        value: 1

  - id: ai.agents.disable-connectors
    name: Turn off AI agent connectors (MCP)
    description: >
      Policy "Configure Agent Connectors" = Force Disable (CAM_AI.admx, new in 26300). The Capability Access
      Manager (CapabilityAccessManager.dll, camsvc service) queries WindowsAI/ConfigureAgentConnectors through
      the PolicyManager when deciding consent between an MCP host (agent) and an MCP server (connector): with
      2, it denies without asking. The Policy CSP documentation only lists Enterprise/Education, but on 26300
      Pro the PolicyManager returns the Group Policy value normally (verified in the VM). Windows only
      enforces the policy while the hidden features 61825274 (Feature_CAM_Mcp_PolicyEnforcement) and its
      prerequisite 58336780 are enabled; on a clean 26300.9711 the prerequisite is disabled, so the policy is
      stored but has no effect yet.
    category: AI/Agents
    risk: low
    confidence: admx
    sources:
      - { kind: admx, ref: "CAM_AI.admx:ConfigureAgentConnectors" }
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/ConfigureAgentConnectors" }
      - { kind: re, ref: "26300/cam-ai-configure-agent-connectors" }
    minBuild: 26300
    requiresFeature: [61825274, 58336780]
    tags: [ai, agents, mcp, policy]
    breaks: Windows AI agents (and apps that use the agent registry) cannot use MCP connectors.
    references:
      - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowsai
    i18n:
      pt-BR:
        name: Desativar os conectores de agentes de IA (MCP)
        description: >
          Política "Configurar Conectores de Agente" = Forçar Desabilitação (CAM_AI.admx, nova no 26300). O
          Gerenciador de Acesso à Funcionalidade (CapabilityAccessManager.dll, serviço camsvc) consulta
          WindowsAI/ConfigureAgentConnectors pelo PolicyManager ao decidir o consentimento entre um host MCP
          (agente) e um servidor MCP (conector): com 2, nega sem perguntar. A documentação da Policy CSP cita
          só Enterprise/Education, mas no 26300 Pro o PolicyManager devolve o valor da política de grupo
          normalmente (conferido na VM). O Windows só aplica a política enquanto os recursos ocultos 61825274
          (Feature_CAM_Mcp_PolicyEnforcement) e o pré-requisito 58336780 estão ativados; num 26300.9711 limpo o
          pré-requisito vem desativado, então a política fica gravada mas ainda não tem efeito.
        breaks: Agentes de IA do Windows (e apps que usam o registro de agentes) não conseguem usar conectores MCP.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: ConfigureAgentConnectors
        kind: dword
        value: 2

  - id: ai.recall.disallow
    name: Do not allow Recall to be enabled (removes the component)
    description: >
      Policy "Allow Recall to be enabled" = Disabled: the Recall optional component is disabled and its files
      are removed from the PC; saved snapshots are deleted. Requires a restart. Only has an effect on Copilot+
      PCs.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/AllowRecallEnablement" }
      - { kind: admx, ref: "WindowsCopilot.admx:AllowRecallEnablement" }
      - { kind: tool, ref: "win11debloat:Disable_AI_Recall" }
    minBuild: 26100
    tags: [recall, ai, policy, privacy]
    breaks: Recall (and already saved snapshots, which are deleted).
    i18n:
      pt-BR:
        name: Não permitir ativar o Recall (remove o componente)
        description: >
          Política "Permitir que o Recall seja habilitado" = Desabilitada: o componente opcional do Recall fica
          desativado e os arquivos dele são removidos do PC; instantâneos salvos são apagados. Exige reiniciar.
          Só tem efeito em PCs Copilot+.
        breaks: Recall (e instantâneos já salvos, que são apagados).
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: AllowRecallEnablement
        kind: dword
        value: 0

  - id: ai.paint.disable
    name: Turn off AI features in Paint
    description: Policies that turn off Cocreator, Generative fill and Image Creator in Paint.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/DisableCocreator" }
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/DisableGenerativeFill" }
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/DisableImageCreator" }
      - { kind: admx, ref: "WindowsCopilot.admx:DisableCocreator" }
      - { kind: admx, ref: "WindowsCopilot.admx:DisableGenerativeFill" }
      - { kind: admx, ref: "WindowsCopilot.admx:DisableImageCreator" }
      - { kind: tool, ref: "win11debloat:Disable_Paint_AI_Features" }
    minBuild: 26100
    tags: [ai, paint, policy]
    i18n:
      pt-BR:
        name: Desativar os recursos de IA do Paint
        description: Políticas que desligam o Cocriador, o Preenchimento generativo e o Criador de Imagens no Paint.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint
        name: DisableCocreator
        kind: dword
        value: 1
      - type: registry
        path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint
        name: DisableGenerativeFill
        kind: dword
        value: 1
      - type: registry
        path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint
        name: DisableImageCreator
        kind: dword
        value: 1

  - id: ai.notepad.disable
    name: Turn off AI features in Notepad
    description: >
      Notepad policy (administrative template distributed by Microsoft with the app) that turns off Rewrite,
      Summarize and the other AI features.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "win11debloat:Disable_Notepad_AI_Features" }
      - { kind: tool, ref: "winutil:WPFTweaksWindowsAI" }
    tags: [ai, notepad, policy]
    i18n:
      pt-BR:
        name: Desativar os recursos de IA do Bloco de Notas
        description: >
          Política do Bloco de Notas (modelo administrativo distribuído pela Microsoft junto do app) que desliga
          Reescrever, Resumir e as demais funções de IA.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\WindowsNotepad
        name: DisableAIFeatures
        kind: dword
        value: 1

  - id: ai.settings-agent.disable
    name: Turn off the AI agent in Settings search
    description: >
      Policy "Disable Settings agentic search experience": the Settings app search goes back to using only the
      regular index and semantic search, without the agent that changes settings for you. The Policy CSP only
      lists Enterprise/Education; on Pro/Home the effect is not guaranteed.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - WindowsAI/DisableSettingsAgent" }
      - { kind: admx, ref: "WindowsCopilot.admx:DisableSettingsAgent" }
    minBuild: 26100
    tags: [ai, agents, settings, policy]
    i18n:
      pt-BR:
        name: Desativar o agente de IA na pesquisa das Configurações
        description: >
          Política "Desativar a experiência de pesquisa agêntica das Configurações": a busca do app Configurações
          volta a usar só o índice normal e a busca semântica, sem o agente que altera configurações por você. A
          Policy CSP lista só Enterprise/Education; no Pro/Home o efeito não é garantido.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: DisableSettingsAgent
        kind: dword
        value: 1

  - id: ai.fabric-service.manual
    name: Windows AI service (WSAIFabricSvc) on demand only
    description: >
      Changes the "Windows AI Fabric" service from automatic to manual: it no longer starts with Windows and
      only runs when an AI feature calls it.
    risk: low
    confidence: community
    minBuild: 26100
    sources:
      - { kind: tool, ref: "win11debloat:Disable_AI_Service_Auto_Start" }
      - { kind: tool, ref: "winutil:WPFTweaksWindowsAI" }
    tags: [ai, service, performance]
    breaks: Local AI features may take a little longer the first time.
    i18n:
      pt-BR:
        name: Serviço de IA do Windows (WSAIFabricSvc) só sob demanda
        description: >
          Muda o serviço "Windows AI Fabric" de automático para manual: ele deixa de iniciar com o Windows e só roda
          quando um recurso de IA o chama.
        breaks: Recursos de IA locais podem demorar um pouco mais na primeira vez.
    actions:
      - type: service
        name: WSAIFabricSvc
        startup: manual
