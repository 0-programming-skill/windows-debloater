      - { kind: tool, ref: "winutil:WPFTweaksEdgeDebloat" }
    tags: [edge, telemetria, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: UserFeedbackAllowed
        kind: dword
        value: 0

  - id: edge.new-tab-clean
    name: Nova guia do Edge sem notícias e sem sites patrocinados
    description: Políticas do Edge que removem o conteúdo da Microsoft (MSN) da Nova guia e os atalhos padrão patrocinados.
    risk: low
