# Microsoft Edge (por políticas do navegador).
category: Navegador/Microsoft Edge

tweaks:
  - id: edge.disable-startup-boost
    name: Desativar o "Aumento de inicialização" do Edge
    description: Impede que o Edge fique pré-carregado em segundo plano ao iniciar o Windows.
    risk: low
    confidence: community
    tags: [edge, desempenho, politica]
    references:
      - https://learn.microsoft.com/deployedge/microsoft-edge-policies#startupboostenabled
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: StartupBoostEnabled
        kind: dword
        value: 0

  - id: edge.disable-background-mode
    name: Não manter o Edge em segundo plano
    description: Impede que o Edge continue rodando em segundo plano depois de fechado.
    risk: low
    confidence: community
    tags: [edge, desempenho, politica]
    breaks: Notificações de sites e extensões em segundo plano com o Edge fechado.
    references:
      - https://learn.microsoft.com/deployedge/microsoft-edge-policies#backgroundmodeenabled
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: BackgroundModeEnabled
        kind: dword
        value: 0

  - id: edge.hide-first-run
    name: Pular a experiência de primeira execução do Edge
    description: Não exibe o assistente de primeira execução do Edge.
    risk: low
    confidence: community
    tags: [edge, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: HideFirstRunExperience
        kind: dword
        value: 1

  - id: edge.disable-personalization-reporting
    name: Não usar o histórico de navegação para personalizar anúncios
    description: Desativa o envio do histórico de navegação para personalização de anúncios, notícias e serviços.
    risk: low
    confidence: community
    tags: [edge, privacidade, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: PersonalizationReportingEnabled
        kind: dword
        value: 0

  - id: edge.disable-shopping-assistant
    name: Desativar compras no Microsoft Edge
    description: Desativa o assistente de compras (cupons, comparação de preços).
    risk: low
    confidence: community
    tags: [edge, anuncios, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: EdgeShoppingAssistantEnabled
        kind: dword
        value: 0

  - id: edge.diagnostic-data-off
    name: Não enviar dados de diagnóstico do Edge
    description: Define a política DiagnosticData do Edge como 0 (desativado).
    risk: low
    confidence: community
    tags: [edge, telemetria, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: DiagnosticData
        kind: dword
        value: 0

  - id: edge.disable-sidebar
    name: Desativar a barra lateral do Edge (Copilot)
    description: Desativa a barra lateral do Edge, incluindo o Copilot integrado.
    risk: low
    confidence: community
    tags: [edge, ia, copilot, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: HubsSidebarEnabled
        kind: dword
        value: 0

