      - { kind: tool, ref: "winutil:WPFTweaksEdgeDebloat" }
    tags: [edge, privacidade, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Edge
        name: AlternateErrorPagesEnabled
        kind: dword
        value: 0

  - id: edge.disable-search-widget
    name: Desativar a barra de pesquisa do Edge na área de trabalho
    description: Política do Edge que impede o widget de pesquisa (barra do Bing) na área de trabalho.
    risk: low
