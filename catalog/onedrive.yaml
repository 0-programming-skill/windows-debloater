# OneDrive: desinstalar, impedir o uso e tirar do Explorador.
category: Apps/OneDrive

tweaks:
  - id: apps.onedrive.uninstall
    name: Desinstalar o OneDrive
    description: >
      Fecha o OneDrive e roda o desinstalador oficial dele (OneDriveSetup.exe /uninstall, o mesmo de
      "Aplicativos instalados"). Depois apaga só os arquivos do programa (%LocalAppData%\Microsoft\OneDrive e
      %ProgramData%\Microsoft OneDrive) e a entrada que instala o OneDrive no primeiro logon do usuário. A pasta
      de arquivos do usuário (%UserProfile%\OneDrive) não é tocada. Para reinstalar: winget install Microsoft.OneDrive.
      Contas criadas depois ainda podem receber o OneDrive no primeiro logon (use também
      apps.onedrive.disable-sync-policy).
    risk: high
    confidence: community
    reversible: false
    sources:
      - { kind: tool, ref: "winutil:WPFTweaksRemoveOneDrive" }
      - { kind: tool, ref: "sophiapp:OneDrive" }
    tags: [onedrive, appx, nuvem]
    breaks: >
      Sincronização de arquivos com o OneDrive, backup de pastas (Área de Trabalho, Documentos, Imagens) e
      arquivos "sob demanda" que ainda não foram baixados (eles ficam só na nuvem; baixe antes o que precisar).
    actions:
      - type: powershell
        detect: |
          $paths = @("$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe", "$env:ProgramFiles\Microsoft OneDrive\OneDrive.exe", "${env:ProgramFiles(x86)}\Microsoft OneDrive\OneDrive.exe")
          $installed = @($paths | Where-Object { Test-Path $_ }).Count -gt 0
          $pending = $null -ne (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OneDriveSetup -ErrorAction SilentlyContinue)
          $uninst = Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OneDriveSetup.exe'
          -not ($installed -or $pending -or $uninst)
        apply: |
          Get-Process -Name OneDrive, FileCoAuth -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $setup = $null
          $u = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OneDriveSetup.exe' -ErrorAction SilentlyContinue).UninstallString
          if ($u -and $u -match '^"?([^"]+OneDriveSetup\.exe)"?') { $setup = $Matches[1] }
          if (-not $setup -or -not (Test-Path $setup)) {
            $setup = @("$env:SystemRoot\System32\OneDriveSetup.exe", "$env:SystemRoot\SysWOW64\OneDriveSetup.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $installed = @("$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe", "$env:ProgramFiles\Microsoft OneDrive\OneDrive.exe", "${env:ProgramFiles(x86)}\Microsoft OneDrive\OneDrive.exe") | Where-Object { Test-Path $_ }
          if ($installed -and $setup) {
            $allUsers = @($installed | Where-Object { $_ -notlike "$env:LOCALAPPDATA*" }).Count -gt 0
            $argList = if ($allUsers) { '/uninstall /allusers' } else { '/uninstall' }
            $p = Start-Process -FilePath $setup -ArgumentList $argList -Wait -PassThru -WindowStyle Hidden
            if ($p.ExitCode -ne 0) { throw "OneDriveSetup.exe $argList terminou com código $($p.ExitCode)" }
          }
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OneDriveSetup -ErrorAction SilentlyContinue
          foreach ($dir in @("$env:LOCALAPPDATA\Microsoft\OneDrive", "$env:ProgramData\Microsoft OneDrive")) {
            if (Test-Path $dir) { Remove-Item -Path $dir -Recurse -Force -ErrorAction SilentlyContinue }
          }
          $left = @("$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe", "$env:ProgramFiles\Microsoft OneDrive\OneDrive.exe", "${env:ProgramFiles(x86)}\Microsoft OneDrive\OneDrive.exe") | Where-Object { Test-Path $_ }
          if ($left) { throw "OneDrive ainda presente: $($left -join ', ')" }

  - id: apps.onedrive.disable-sync-policy
    name: Impedir o uso do OneDrive para armazenar arquivos (política)
    description: >
      Política "Impedir o uso do OneDrive para armazenamento de arquivos": o OneDrive não pode ser aberto nem
      sincronizar, e some do Explorador. Funciona mesmo com o OneDrive instalado e vale para todos os usuários.
    risk: medium
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - System/DisableOneDriveFileSync" }
      - { kind: admx, ref: "SkyDrive.admx:PreventOnedriveFileSync" }
      - { kind: tool, ref: "sophia:OneDrive" }
    tags: [onedrive, nuvem, politica]
    breaks: OneDrive (inclusive backup de pastas) e apps que salvam direto no OneDrive.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\OneDrive
        name: DisableFileSyncNGSC
        kind: dword
        value: 1
