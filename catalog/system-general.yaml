# General system settings (behavior, diagnostics, startup).
category: System/General

tweaks:
  - id: system.long-paths.enable
    name: Enable Win32 long paths
    description: >
      Turns on "Enable Win32 long paths": programs that declare support can use paths longer than
      260 characters (useful for development, node_modules, git repositories).
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - ADMX_FileSys/LongPathsEnabled" }
      - { kind: admx, ref: "FileSys.admx:LongPathsEnabled" }
      - { kind: tool, ref: "winutil:WPFToggleLongPaths" }
    tags: [system, files, development]
    i18n:
      pt-BR:
        name: Ativar caminhos longos do Win32
        description: >
          Liga "Habilitar caminhos longos do Win32": programas que declaram suporte podem usar caminhos com mais de
          260 caracteres (útil para desenvolvimento, node_modules, repositórios git).
    actions:
      - type: registry
        path: HKLM\SYSTEM\CurrentControlSet\Control\FileSystem
        name: LongPathsEnabled
        kind: dword
        value: 1

  - id: system.bsod.show-details
    name: Show error parameters on the blue screen
    description: Shows the stop code and technical parameters on the blue screen (BSOD), useful for diagnosing the crash.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFToggleDetailedBSoD" }
      - { kind: tool, ref: "sophia:BSoDStopError" }
    tags: [system, diagnostics]
    i18n:
      pt-BR:
        name: Mostrar os parâmetros do erro na tela azul
        description: Mostra o código e os parâmetros técnicos na tela azul (BSOD), úteis para diagnosticar o travamento.
    actions:
      - type: registry
        path: HKLM\SYSTEM\CurrentControlSet\Control\CrashControl
        name: DisplayParameters
        kind: dword
        value: 1

  - id: system.startup.no-app-delay
    name: Don't delay startup apps
    description: >
      Explorer waits a few seconds before launching startup programs. With 0, they launch right
      after sign-in (the desktop may be contended for the first few seconds).
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winhance:startup-delay" }
      - { kind: tool, ref: "optimizerduck:StartupDelay" }
    tags: [startup, performance]
    i18n:
      pt-BR:
        name: Não atrasar os apps de inicialização
        description: >
          O Explorador espera alguns segundos antes de abrir os programas da inicialização. Com 0, eles abrem logo
          após o logon (a área de trabalho pode ficar disputada nos primeiros segundos).
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Serialize
        name: StartupDelayInMSec
        kind: dword
        value: 0
