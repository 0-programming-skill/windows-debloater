# Menu Iniciar e Pesquisa.
category: Interface/Iniciar e Pesquisa

tweaks:
  - id: ui.search.disable-web-search
    name: Desativar resultados da web (Bing) na pesquisa do Iniciar
    description: Faz a pesquisa do menu Iniciar procurar apenas no PC, sem sugestões e resultados do Bing.
    risk: low
    tags: [pesquisa, bing, politica]
    breaks: Resultados e sugestões da web na pesquisa do Windows.
    actions:
      - type: registry
        path: HKCU\Software\Policies\Microsoft\Windows\Explorer
        name: DisableSearchBoxSuggestions
        kind: dword
        value: 1
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Search
        name: BingSearchEnabled
        kind: dword
        value: 0

  - id: ui.search.disable-highlights
    name: Desativar destaques da pesquisa
    description: Remove as ilustrações e conteúdos em destaque (datas comemorativas, tendências) da caixa de pesquisa.
    risk: low
    tags: [pesquisa]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings
        name: IsDynamicSearchBoxEnabled
        kind: dword
        value: 0

  - id: ui.search.disable-cloud-search
    name: Não pesquisar conteúdo das contas na nuvem
    description: Desativa a pesquisa de conteúdo da conta Microsoft e da conta corporativa/escolar.
    risk: low
    tags: [pesquisa, nuvem]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings
        name: IsMSACloudSearchEnabled
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings
        name: IsAADCloudSearchEnabled
        kind: dword
        value: 0

  - id: ui.search.taskbar-icon-only
    name: Pesquisa da barra de tarefas apenas como ícone
    description: Troca a caixa de pesquisa da barra de tarefas por um ícone, economizando espaço.
    risk: low
    tags: [pesquisa, barra-de-tarefas]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Search
        name: SearchboxTaskbarMode
        kind: dword
        value: 1

  - id: ui.start.no-recent-files
    name: Não mostrar arquivos recentes no Iniciar e listas de atalhos
    description: Desativa "Mostrar itens abertos recentemente no Iniciar, nas Listas de Atalhos e no Explorador de Arquivos".
    risk: low
    tags: [iniciar, privacidade]
    breaks: Listas de atalhos (jump lists) e a seção Recomendados ficam sem arquivos recentes.
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Start_TrackDocs
        kind: dword
        value: 0

  - id: ui.start.more-pins
    name: Layout do Iniciar com mais itens fixados
    description: Usa o layout "Mais fixos", reduzindo a seção Recomendados.
    risk: low
    minBuild: 22621
    tags: [iniciar]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Start_Layout
        kind: dword
        value: 1
