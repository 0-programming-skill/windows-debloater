# Permissões de apps, localização, área de transferência, fala e sincronização.
category: Privacidade/Permissões e dados pessoais

tweaks:
  - id: privacy.location.disable
    name: Desligar o serviço de localização (política)
    description: >
      Política "Desativar localização": o recurso de localização do Windows fica desligado e nenhum programa
      consegue usá-lo. Diferente do botão nas Configurações, o usuário não consegue religar enquanto a política
      estiver aplicada.
    risk: medium
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - System/AllowLocation" }
      - { kind: admx, ref: "Sensors.admx:DisableLocation_2" }
      - { kind: tool, ref: "win11debloat:Disable_Location_Services" }
    tags: [privacidade, localizacao, politica]
    breaks: >
      Mapas, clima pela localização, "Encontrar meu dispositivo", fuso horário automático pela localização e apps
      que pedem a posição do PC.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors
        name: DisableLocation
        kind: dword
        value: 1

  - id: privacy.location.deny-apps
    name: Negar acesso à localização para os apps (padrão)
    description: >
      Desliga os botões "Serviços de localização" (no PC) e "Permitir que os aplicativos acessem sua localização"
      (no usuário) em Configurações > Privacidade. O usuário pode religar pelas Configurações.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "sophia:LocationServices" }
      - { kind: tool, ref: "winhance:location" }
    tags: [privacidade, localizacao, permissoes]
    breaks: Apps deixam de saber a localização até o usuário permitir de novo.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location
        name: Value
        kind: string
        value: Deny
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location
        name: Value
        kind: string
        value: Deny

  - id: privacy.camera.deny-apps
    name: Negar acesso à câmera para os apps (padrão)
    description: >
      Desliga "Permitir que os aplicativos acessem sua câmera" para o usuário atual. Não é uma política: o
      usuário pode permitir de novo (por app) em Configurações > Privacidade > Câmera.
    risk: medium
    confidence: community
    sources:
      - { kind: tool, ref: "privacysexy:webcam" }
    tags: [privacidade, camera, permissoes]
    breaks: Câmera em apps da Store e em apps de videochamada até o usuário permitir de novo.
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam
        name: Value
        kind: string
        value: Deny

  - id: privacy.microphone.deny-apps
    name: Negar acesso ao microfone para os apps (padrão)
    description: >
      Desliga "Permitir que os aplicativos acessem seu microfone" para o usuário atual. O usuário pode permitir
      de novo (por app) em Configurações > Privacidade > Microfone.
    risk: medium
    confidence: community
    sources:
      - { kind: tool, ref: "privacysexy:microphone" }
    tags: [privacidade, microfone, permissoes]
    breaks: Microfone em apps da Store, ditado e chamadas até o usuário permitir de novo.
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone
        name: Value
        kind: string
        value: Deny

  - id: privacy.app-diagnostics.deny
    name: Impedir que apps leiam informações de diagnóstico
    description: >
      Política "Permitir que aplicativos do Windows acessem informações de diagnóstico sobre outros aplicativos"
      = Forçar negação.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Privacy/LetAppsGetDiagnosticInfo" }
      - { kind: admx, ref: "AppPrivacy.admx:LetAppsGetDiagnosticInfo" }
      - { kind: tool, ref: "privacysexy:app-diagnostics" }
    tags: [privacidade, permissoes, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name: LetAppsGetDiagnosticInfo
        kind: dword
        value: 2

  - id: privacy.voice-activation.deny
    name: Impedir que apps sejam ativados por voz
    description: Política "Permitir que aplicativos do Windows sejam ativados por voz" = Forçar negação.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Privacy/LetAppsActivateWithVoice" }
      - { kind: admx, ref: "AppPrivacy.admx:LetAppsActivateWithVoice" }
    tags: [privacidade, voz, politica]
    breaks: Assistentes ativados por palavra-chave ("Ei, ...").
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name: LetAppsActivateWithVoice
        kind: dword
        value: 2

  - id: privacy.clipboard.disable-history
    name: Desativar o histórico da área de transferência
    description: Política que impede o Windows de guardar o histórico da área de transferência (Win+V).
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Experience/AllowClipboardHistory" }
      - { kind: admx, ref: "OSPolicy.admx:AllowClipboardHistory" }
      - { kind: tool, ref: "privacysexy:clipboard-history" }
    tags: [privacidade, area-de-transferencia, politica]
    breaks: Win+V passa a mostrar só emojis/GIFs, sem o histórico de itens copiados.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\System
        name: AllowClipboardHistory
        kind: dword
        value: 0

  - id: privacy.clipboard.disable-cloud-sync
    name: Não sincronizar a área de transferência entre dispositivos
    description: Política que impede o envio do conteúdo copiado para outros dispositivos da mesma conta.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Privacy/AllowCrossDeviceClipboard" }
      - { kind: admx, ref: "OSPolicy.admx:AllowCrossDeviceClipboard" }
    tags: [privacidade, area-de-transferencia, nuvem, politica]
    breaks: Copiar num PC e colar em outro (ou no celular com o SwiftKey).
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\System
        name: AllowCrossDeviceClipboard
        kind: dword
        value: 0

  - id: privacy.speech.disable-online
    name: Desativar o reconhecimento de fala online
    description: >
      Desliga o reconhecimento de fala online do usuário e aplica a política "Permitir que usuários ativem
      serviços de reconhecimento de fala online" = Desabilitada (a voz não é enviada à Microsoft).
    risk: low
    confidence: official
    sources:
      - { kind: admx, ref: "Globalization.admx:AllowInputPersonalization" }
      - { kind: msdocs, ref: "Policy CSP - Privacy/AllowInputPersonalization" }
      - { kind: tool, ref: "winutil:WPFTweaksTelemetry" }
    tags: [privacidade, fala, politica]
    breaks: Ditado por voz (Win+H) e controle por voz que dependem do serviço online.
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Speech_OneCore\Settings\OnlineSpeechPrivacy
        name: HasAccepted
        kind: dword
        value: 0
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\InputPersonalization
        name: AllowInputPersonalization
        kind: dword
        value: 0

  - id: privacy.typing.disable-insights
    name: Desativar os "insights de digitação"
    description: Desliga as estatísticas de digitação (Configurações > Hora e idioma > Digitação > Insights de digitação).
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winhance:typing-insights" }
    tags: [privacidade, digitacao]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\input\Settings
        name: InsightsEnabled
        kind: dword
        value: 0

  - id: privacy.handwriting.disable-data-sharing
    name: Não enviar dados de escrita à mão
    description: >
      Desliga o compartilhamento de dados de personalização de escrita à mão e o relatório de erros de
      reconhecimento de escrita à mão (os mesmos valores que a política "Restringir comunicação com a Internet"
      liga em grupo, aplicados só para esses dois itens).
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "privacysexy:handwriting" }
      - { kind: tool, ref: "optimizerduck:DisableTelemetry" }
    tags: [privacidade, escrita, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\HandwritingErrorReports
        name: PreventHandwritingErrorReports
        kind: dword
        value: 1
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\TabletPC
        name: PreventHandwritingDataSharing
        kind: dword
        value: 1

  - id: privacy.settings-sync.disable
    name: Não sincronizar configurações do Windows com a conta
    description: >
      Política "Não sincronizar": tema, senhas, idioma e outras preferências deixam de ser enviados à conta
      Microsoft, e o usuário não pode religar.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - ADMX_SettingSync/DisableSettingSync" }
      - { kind: admx, ref: "SettingSync.admx:DisableSettingSync" }
      - { kind: tool, ref: "privacysexy:setting-sync" }
    tags: [privacidade, nuvem, sincronizacao, politica]
    breaks: As preferências não acompanham o usuário em outro PC (nem ao reinstalar o Windows).
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\SettingSync
        name: DisableSettingSync
        kind: dword
        value: 2
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\SettingSync
        name: DisableSettingSyncUserOverride
        kind: dword
        value: 1

  - id: privacy.find-my-device.disable
    name: Desativar o "Encontrar meu dispositivo"
    description: Política que desliga o "Encontrar meu dispositivo" (localização periódica do PC na conta Microsoft).
    risk: medium
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Experience/AllowFindMyDevice" }
      - { kind: admx, ref: "FindMy.admx:FindMy_AllowFindMyDeviceConfig" }
      - { kind: tool, ref: "win11debloat:Disable_Find_My_Device" }
    tags: [privacidade, localizacao, politica]
    breaks: Localizar ou bloquear o PC perdido pela conta Microsoft.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\FindMyDevice
        name: AllowFindMyDevice
        kind: dword
        value: 0

  - id: privacy.messaging.disable-cloud-sync
    name: Não fazer backup de mensagens de texto na nuvem
    description: Política "Permitir backup em nuvem de mensagens" = Desabilitada.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Messaging/AllowMessageSync" }
      - { kind: admx, ref: "Messaging.admx:AllowMessageSync" }
    tags: [privacidade, nuvem, politica]
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\Messaging
        name: AllowMessageSync
        kind: dword
        value: 0

  - id: privacy.search.disable-history
    name: Não guardar o histórico de pesquisa do dispositivo
    description: Desliga "Histórico de pesquisa neste dispositivo" (Configurações > Privacidade > Permissões de pesquisa).
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "win11debloat:Disable_Search_History" }
    tags: [privacidade, pesquisa]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings
        name: IsDeviceSearchHistoryEnabled
        kind: dword
        value: 0
