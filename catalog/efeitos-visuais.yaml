# Efeitos visuais, tema e teclado/acessibilidade.
category: Interface/Efeitos visuais e tema

tweaks:
  - id: ui.visual.disable-transparency
    name: Desativar os efeitos de transparência
    description: Desliga a transparência (acrílico/mica) da barra de tarefas, do Iniciar e das janelas do sistema.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "win11debloat:Disable_Transparency" }
      - { kind: tool, ref: "winhance:transparency" }
    tags: [visual, desempenho]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        name: EnableTransparency
        kind: dword
        value: 0

  - id: ui.visual.disable-window-animations
    name: Desativar animações de janelas e da barra de tarefas
    description: >
      Desliga "Animar janelas ao minimizar e maximizar" e as animações da barra de tarefas, e marca a opção
      "Personalizado" em Opções de desempenho. Vale depois de sair e entrar de novo na conta.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFTweaksDisplay" }
      - { kind: tool, ref: "winhance:visual-effects" }
    tags: [visual, desempenho, animacoes]
    actions:
      - type: registry
        path: HKCU\Control Panel\Desktop\WindowMetrics
        name: MinAnimate
        kind: string
        value: "0"
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: TaskbarAnimations
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects
        name: VisualFXSetting
        kind: dword
        value: 3

  - id: ui.visual.disable-peek
    name: Desativar a "Espiada" da área de trabalho
    description: Desliga a pré-visualização da área de trabalho ao passar o mouse no canto da barra de tarefas (Aero Peek).
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFTweaksDisplay" }
      - { kind: tool, ref: "atlas:visual-effects" }
    tags: [visual, desempenho]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\DWM
        name: EnableAeroPeek
        kind: dword
        value: 0

  - id: ui.visual.disable-list-effects
    name: Desativar sombras e seleção translúcida nos ícones
    description: Desliga a sombra sob os nomes dos ícones e o retângulo de seleção translúcido do Explorador.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFTweaksDisplay" }
      - { kind: tool, ref: "winhance:visual-effects" }
    tags: [visual, desempenho]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: ListviewAlphaSelect
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: ListviewShadow
        kind: dword
        value: 0

  - id: ui.visual.no-drag-full-windows
    name: Não mostrar o conteúdo da janela ao arrastar
    description: Ao arrastar uma janela, mostra só o contorno (alivia GPUs e PCs muito fracos). Vale depois de sair e entrar.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFTweaksDisplay" }
    tags: [visual, desempenho]
    actions:
      - type: registry
        path: HKCU\Control Panel\Desktop
        name: DragFullWindows
        kind: string
        value: "0"

  - id: ui.visual.faster-menus
    name: Menus mais rápidos (atraso de 100 ms)
    description: >
      Reduz o atraso para abrir submenus ao passar o mouse de 400 ms (padrão) para 100 ms. Vale depois de sair e
      entrar na conta.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFTweaksDisplay" }
      - { kind: tool, ref: "winhance:menu-delay" }
    tags: [visual, responsividade]
    actions:
      - type: registry
        path: HKCU\Control Panel\Desktop
        name: MenuShowDelay
        kind: string
        value: "100"

  - id: ui.visual.wallpaper-full-quality
    name: Papel de parede JPEG sem recompressão
    description: >
      O Windows recomprime papéis de parede JPEG com qualidade 85 %. Com 100, a imagem fica sem perda adicional.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "sophia:JPEGWallpapersQuality" }
      - { kind: tool, ref: "winhance:wallpaper-quality" }
    tags: [visual, papel-de-parede]
    actions:
      - type: registry
        path: HKCU\Control Panel\Desktop
        name: JPEGImportQuality
        kind: dword
        value: 100

  - id: ui.theme.dark-mode
    name: Usar o modo escuro (apps e sistema)
    description: Ativa o tema escuro para o Windows (barra de tarefas, Iniciar) e para os apps.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFToggleDarkMode" }
      - { kind: tool, ref: "win11debloat:Enable_Dark_Mode" }
    tags: [visual, tema, preferencia]
    actions:
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        name: AppsUseLightTheme
        kind: dword
        value: 0
      - type: registry
        path: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        name: SystemUsesLightTheme
        kind: dword
        value: 0

  - id: ui.accessibility.disable-shortcut-keys
    name: Desativar os atalhos de Teclas de Aderência, Filtragem e Alternância
    description: >
      Impede que apertar Shift cinco vezes (Teclas de Aderência), segurar o Shift direito (Teclas de Filtragem) ou
      segurar o Num Lock (Teclas de Alternância) abra o aviso de acessibilidade. Os recursos continuam disponíveis
      nas Configurações.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFToggleStickyKeys" }
      - { kind: tool, ref: "sophia:StickyShift" }
    tags: [acessibilidade, teclado, jogos]
    breaks: Quem usa os atalhos de acessibilidade precisa ligá-los pelas Configurações.
    actions:
      - type: registry
        path: HKCU\Control Panel\Accessibility\StickyKeys
        name: Flags
        kind: string
        value: "506"
      - type: registry
        path: HKCU\Control Panel\Accessibility\Keyboard Response
        name: Flags
        kind: string
        value: "122"
      - type: registry
        path: HKCU\Control Panel\Accessibility\ToggleKeys
        name: Flags
        kind: string
        value: "58"

  - id: ui.keyboard.numlock-on
    name: Num Lock ligado ao entrar
    description: Liga o Num Lock quando o usuário entra na conta.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "winutil:WPFToggleNumLock" }
      - { kind: tool, ref: "sophia:NumLock" }
    tags: [teclado, preferencia]
    actions:
      - type: registry
        path: HKCU\Control Panel\Keyboard
        name: InitialKeyboardIndicators
        kind: string
        value: "2"

  - id: ui.keyboard.printscreen-classic
    name: Print Screen copia a tela (sem abrir a Ferramenta de Captura)
    description: Desliga "Usar a tecla Print Screen para abrir a captura de tela"; a tecla volta a copiar a tela inteira.
    risk: low
    confidence: community
    sources:
      - { kind: tool, ref: "sophia:PrtScnSnippingTool" }
    tags: [teclado, preferencia]
    actions:
      - type: registry
        path: HKCU\Control Panel\Keyboard
        name: PrintScreenKeyForSnippingEnabled
        kind: dword
        value: 0
