# Performance and system behavior tweaks.
category: System/Performance

tweaks:
  - id: perf.game-dvr.disable
    name: Turn off background recording (Game DVR)
    description: Turns off Xbox Game Bar background game capture, which uses system resources.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - ApplicationManagement/AllowGameDVR" }
      - { kind: admx, ref: "GameDVR.admx:AllowGameDVR" }
    tags: [gaming, performance]
    breaks: Xbox Game Bar recordings and captures.
    i18n:
      pt-BR:
        name: Desativar a gravação em segundo plano (Game DVR)
        description: Desativa a captura de jogos em segundo plano da Xbox Game Bar, que consome recursos.
        breaks: Gravações e capturas da Xbox Game Bar.
    actions:
      - type: registry
        path: HKCU\System\GameConfigStore
        name: GameDVR_Enabled
        kind: dword
        value: 0
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR
        name: AllowGameDVR
        kind: dword
        value: 0

  - id: perf.hibernation.disable
    name: Disable hibernation
    description: >
      Runs "powercfg /hibernate off", deleting hiberfil.sys and freeing disk space (proportional to the
      amount of RAM).
    risk: medium
    confidence: community
    tags: [power, disk]
    breaks: Hibernation and Fast Startup stop working.
    precondition:
      # Applicable if hibernation is already off (so it can be turned back on) or if the system supports it.
      # IsPwrHibernateAllowed is false on Hyper-V VMs and firmware without S4: there "powercfg /h on" fails.
      powershell: |
        $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' -Name HibernateEnabled -ErrorAction SilentlyContinue).HibernateEnabled
        if ($v -eq 0) { $true; return }
        # P/Invoke without Add-Type (no C# compilation, much faster). Returns BOOLEAN (1 byte).
        $tb = [AppDomain]::CurrentDomain.DefineDynamicAssembly((New-Object Reflection.AssemblyName 'DebloaterPower'), 'Run').DefineDynamicModule('m').DefineType('PowrProf', 'Public, Class')
        $null = $tb.DefinePInvokeMethod('IsPwrHibernateAllowed', 'powrprof.dll', 'Public, Static, PinvokeImpl', 'Standard', [byte], [Type[]]@(), 'Winapi', 'Auto')
        ($tb.CreateType())::IsPwrHibernateAllowed() -ne 0
      reason: the system doesn't support hibernation (firmware without S4, or a VM), so there would be no way to turn it back on.
    i18n:
      pt-BR:
        name: Desativar a hibernação
        description: >
          Executa "powercfg /hibernate off", apagando o hiberfil.sys e liberando espaço em disco
          (proporcional à RAM).
        breaks: Hibernação e Inicialização Rápida deixam de funcionar.
        reason: o sistema não suporta hibernação (firmware sem S4 ou VM), então não haveria como religá-la.
    actions:
      - type: powershell
        detect: |
          $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' -Name HibernateEnabled -ErrorAction SilentlyContinue).HibernateEnabled
          [bool]($v -eq 0)
        apply: powercfg.exe /hibernate off
        revert: powercfg.exe /hibernate on

  - id: perf.fast-startup.disable
    name: Turn off Fast Startup
    description: >
      Makes shutdown a full shutdown (without hibernating the kernel). Avoids problems with dual boot,
      drivers and updates that require a real shutdown.
    risk: low
    confidence: community
    tags: [power, boot]
    breaks: Cold boot may take a few seconds longer.
    i18n:
      pt-BR:
        name: Desativar a Inicialização Rápida
        description: >
          Faz o desligamento ser completo (sem hibernar o kernel). Evita problemas com dual boot,
          drivers e atualizações que exigem desligamento real.
        breaks: A inicialização a frio pode ficar alguns segundos mais lenta.
    actions:
      - type: registry
        path: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power
        name: HiberbootEnabled
        kind: dword
        value: 0

  - id: perf.background-apps.deny
    name: Prevent Store apps from running in the background
    description: Policy "Let Windows apps run in the background" = Force Deny.
    risk: medium
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - Privacy/LetAppsRunInBackground" }
      - { kind: admx, ref: "AppPrivacy.admx:LetAppsRunInBackground" }
    tags: [performance, policy, battery]
    breaks: Background notifications and sync for Store apps (Mail, Teams, Phone Link...).
    i18n:
      pt-BR:
        name: Impedir apps da Store de rodarem em segundo plano
        description: Política "Permitir que aplicativos do Windows sejam executados em segundo plano" = Forçar negação.
        breaks: Notificações e sincronização em segundo plano de apps da Store (Mail, Teams, Vincular ao Celular...).
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name: LetAppsRunInBackground
        kind: dword
        value: 2

  - id: perf.mouse-acceleration.disable
    name: Turn off mouse acceleration
    description: Turns off "Enhance pointer precision", making mouse movement 1:1.
    risk: low
    confidence: community
    tags: [mouse, gaming]
    i18n:
      pt-BR:
        name: Desativar a aceleração do mouse
        description: Desativa "Aumentar precisão do ponteiro", deixando o movimento do mouse 1:1.
    actions:
      - type: registry
        path: HKCU\Control Panel\Mouse
        name: MouseSpeed
        kind: string
        value: "0"
      - type: registry
        path: HKCU\Control Panel\Mouse
        name: MouseThreshold1
        kind: string
        value: "0"
      - type: registry
        path: HKCU\Control Panel\Mouse
        name: MouseThreshold2
        kind: string
        value: "0"

  - id: perf.delivery-optimization.http-only
    name: Delivery Optimization over HTTP only (no P2P)
    description: Turns off sharing updates with other PCs (P2P), downloading only from Microsoft servers.
    risk: low
    confidence: official
    sources:
      - { kind: msdocs, ref: "Policy CSP - DeliveryOptimization/DODownloadMode" }
      - { kind: admx, ref: "DeliveryOptimization.admx:DownloadMode" }
    tags: [windows-update, network, policy]
    i18n:
      pt-BR:
        name: Otimização de Entrega apenas via HTTP (sem P2P)
        description: Desativa o compartilhamento de atualizações com outros PCs (P2P), baixando só dos servidores da Microsoft.
    actions:
      - type: registry
        path: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
        name: DODownloadMode
        kind: dword
        value: 0
