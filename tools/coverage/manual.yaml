# Manual comparison with closed-source tools: ONLY the feature list from the official page/documentation
# (no program was downloaded or run). A "feature" is a group of settings they describe; "tweaks" are
# ours that cover the group (empty = not covered). Texts are our own summaries.
tools:
  - name: O&O ShutUp10++
    url: https://www.oo-software.com/en/shutup10
    license: proprietary (free)
    version: "3.6.1135 (2026-09-29), according to the official page"
    note: >
      The official page does not publish the full list of settings; the groups below come from it and from the
      release announcements on the official O&O blog (blog.oo-software.com). Comparison by group, not by setting.
    features:
      - name: General privacy (telemetry, advertising ID, language list for websites)
        tweaks: [privacy.telemetry.allow-telemetry, privacy.ads.advertising-id, privacy.ads.language-list]
      - name: Activity history and clipboard
        tweaks: [privacy.telemetry.activity-history, privacy.clipboard.disable-history, privacy.clipboard.disable-cloud-sync]
      - name: App privacy (camera, microphone, location, diagnostics, voice)
        tweaks: [privacy.camera.deny-apps, privacy.microphone.deny-apps, privacy.location.deny-apps, privacy.app-diagnostics.deny, privacy.voice-activation.deny]
      - name: Security (Remote Assistance, password reveal and the like)
        tweaks: []
        note: Outside the current focus (security hardening); candidate for a future category.
      - name: Microsoft Edge (privacy policies, Copilot and AI in Edge)
        tweaks: [edge.diagnostic-data-off, edge.disable-personalization-reporting, edge.disable-copilot-page-context, edge.disable-ai-features, edge.disable-sidebar]
      - name: Legacy Microsoft Edge (EdgeHTML)
        tweaks: []
        note: Legacy Edge no longer exists in Windows 11.
      - name: Windows settings sync
        tweaks: [privacy.settings-sync.disable]
      - name: Cortana and Windows Search (web, cloud, history)
        tweaks: [ui.search.disable-web-search, ui.search.disable-cloud-search, privacy.search.disable-history]
      - name: Windows AI (Copilot, Recall, Click to Do)
        tweaks: [ai.copilot.turn-off-policy, ai.copilot.remove-app, ai.recall.disable-snapshots, ai.recall.disallow, ai.click-to-do.disable]
      - name: Location services
        tweaks: [privacy.location.disable, privacy.find-my-device.disable]
      - name: User behavior (tailored experiences, app tracking)
        tweaks: [privacy.telemetry.tailored-experiences, privacy.telemetry.app-launch-tracking]
      - name: Windows Update (P2P, drivers, restart)
        tweaks: [perf.delivery-optimization.http-only, update.exclude-drivers, update.no-auto-restart-logged-on]
      - name: Explorer (sync provider ads)
        tweaks: [privacy.ads.explorer-sync-provider]
      - name: Microsoft Defender and SpyNet (MAPS, samples)
        tweaks: [security.defender.disable-cloud-reporting]
      - name: Lock screen (tips, Spotlight)
        tweaks: [privacy.ads.lock-screen-tips, privacy.ads.spotlight]
      - name: Mobile devices (Phone Link)
        tweaks: [apps.remove.phone-link]
      - name: Taskbar (Widgets, Chat)
        tweaks: [ui.taskbar.disable-widgets, ui.taskbar.hide-chat]
      - name: Miscellaneous (feedback, offline maps)
        tweaks: [privacy.telemetry.feedback-requests, services.maps-broker.disable]

  - name: Wintoys
    url: https://apps.microsoft.com/detail/9P8LTPGCBZXD
    license: proprietary (free, Microsoft Store; Bogdan Pătrăucean)
    version: "update of 2026-08-22, according to the Microsoft Store listing"
    note: >
      Features taken from the official Microsoft Store listing. We ignore the "Wintoys-Performance-Settings"
      GitHub organization, which does not belong to the developer. Several features (cleanup, repair, hardware
      information) are not settings and are outside the scope of a tweak catalog.
    features:
      - name: Performance tweaks (including for games)
        tweaks: [perf.game-dvr.disable, gaming.hags.enable, power.plan.high-performance, power.throttling.disable, services.sysmain.disable]
      - name: Hidden system settings
        tweaks: [ui.explorer.classic-context-menu, ui.taskbar.end-task, system.long-paths.enable]
      - name: Disk cleanup
        tweaks: []
        note: Out of scope (not a reversible setting). Candidate for a separate tool.
      - name: Repair tools (SFC, DISM, CHKDSK)
        tweaks: []
        note: Out of scope.
      - name: Ads and privacy
        tweaks: [privacy.ads.tips-suggestions, privacy.ads.start-suggestions, privacy.telemetry.allow-telemetry, privacy.ads.advertising-id]
      - name: Desktop personalization
        tweaks: [ui.theme.dark-mode, ui.desktop.show-this-pc, ui.taskbar.align-left]
      - name: Uninstall any app (including those without an uninstall option)
        tweaks: [apps.remove.bing-news, edge.remove, apps.onedrive.uninstall, ai.copilot.remove-app]
        note: Only the catalog's curated list, not "any app".
      - name: Disable unnecessary services
        tweaks: [services.xbox.disable, services.fax.disable, services.maps-broker.disable, privacy.telemetry.diagtrack-service]
      - name: Real-time hardware information
        tweaks: []
        note: Out of scope.

  - name: Microsoft PC Manager
    url: https://pcmanager.microsoft.com/en-us
    license: proprietary (free, Microsoft)
    version: "official page read on 2026-10-17 (no version number)"
    note: Microsoft's own maintenance tool; almost none of it is a configuration setting.
    features:
      - name: 'Boost (free up memory and temporary files)'
        tweaks: []
        note: One-off action, not a setting; out of scope.
      - name: Storage management (large files, Storage Sense)
        tweaks: []
        note: Out of scope; Storage Sense may become a future tweak.
      - name: Pop-up control (ads and app notifications)
        tweaks: [privacy.ads.tips-suggestions, privacy.ads.settings-suggestions, privacy.ads.account-notifications]
      - name: Health check (issues and threats)
        tweaks: []
        note: Out of scope.
      - name: Toolbox and mini bar
        tweaks: []
        note: Out of scope.

  - name: NTLite
    url: https://www.ntlite.com/features/
    license: proprietary (free and paid)
    version: "features page read on 2026-10-17"
    note: >
      NTLite mainly edits images (WIM/ESD/ISO) before installation, as well as the running Windows. Only the
      "Settings and tweaks" and "Services" parts are comparable today; the rest becomes backlog for the offline ISO mode.
    features:
      - name: Privacy and telemetry tweaks
        tweaks: [privacy.telemetry.allow-telemetry, privacy.telemetry.diagtrack-service, privacy.telemetry.limit-diagnostics]
      - name: Copilot and AI (including in Edge)
        tweaks: [ai.copilot.remove-app, ai.recall.disallow, edge.disable-ai-features]
      - name: Performance and interface
        tweaks: [perf.background-apps.deny, ui.visual.disable-window-animations, ui.explorer.show-file-extensions]
      - name: Security, network and firewall hardening
        tweaks: [network.llmnr.disable, network.netbios.disable-resolution, ui.explorer.disable-autorun-policy]
        note: Partial coverage; firewall rules are not in the catalog.
      - name: Service startup type
        tweaks: [services.sysmain.disable, services.xbox.disable, privacy.telemetry.wer-service]
      - name: Optional features and features on demand
        tweaks: [features.smb1.disable, features.work-folders.disable, features.media-player-legacy.disable]
    backlog:
      - Removal of Windows components in the image (more than 500, with dependency analysis)
      - Integration of cumulative updates and Defender definitions into the image
      - Integration of drivers (INF) into the image
      - Unattended installation (OOBE, local accounts, regions, partitioning)
      - Post-installation scripts and installers
      - WIM/ESD/ISO conversion and edition removal
