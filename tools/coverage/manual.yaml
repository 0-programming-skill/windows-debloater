# Comparação manual com ferramentas de código fechado: SÓ a lista de recursos da página/documentação oficial
# (nenhum programa foi baixado ou executado). Um "recurso" é um grupo de ajustes descrito por eles; "tweaks" são os
# nossos que cobrem o grupo (vazio = não coberto). Textos são resumos nossos.
tools:
  - name: O&O ShutUp10++
    url: https://www.oo-software.com/en/shutup10
    license: proprietária (gratuita)
    version: "3.6.1135 (29/09/2026), segundo a página oficial"
    note: >
      A página oficial não publica a lista completa de configurações; os grupos abaixo vêm dela e dos anúncios de
      versão no blog oficial da O&O (blog.oo-software.com). Comparação por grupo, não por configuração.
    features:
      - name: Privacidade geral (telemetria, ID de anúncio, idioma para sites)
        tweaks: [privacy.telemetry.allow-telemetry, privacy.ads.advertising-id, privacy.ads.language-list]
      - name: Histórico de atividades e área de transferência
        tweaks: [privacy.telemetry.activity-history, privacy.clipboard.disable-history, privacy.clipboard.disable-cloud-sync]
      - name: Privacidade de apps (câmera, microfone, localização, diagnósticos, voz)
        tweaks: [privacy.camera.deny-apps, privacy.microphone.deny-apps, privacy.location.deny-apps, privacy.app-diagnostics.deny, privacy.voice-activation.deny]
      - name: Segurança (Assistência Remota, revelar senha e afins)
        tweaks: []
        note: Fora do foco atual (endurecimento de segurança); candidato a categoria futura.
      - name: Microsoft Edge (políticas de privacidade, Copilot e IA no Edge)
        tweaks: [edge.diagnostic-data-off, edge.disable-personalization-reporting, edge.disable-copilot-page-context, edge.disable-ai-features, edge.disable-sidebar]
      - name: Microsoft Edge legado (EdgeHTML)
        tweaks: []
        note: O Edge legado não existe mais no Windows 11.
      - name: Sincronização das configurações do Windows
        tweaks: [privacy.settings-sync.disable]
      - name: Cortana e Pesquisa do Windows (web, nuvem, histórico)
        tweaks: [ui.search.disable-web-search, ui.search.disable-cloud-search, privacy.search.disable-history]
      - name: Windows AI (Copilot, Recall, Clique para Fazer)
        tweaks: [ai.copilot.turn-off-policy, ai.copilot.remove-app, ai.recall.disable-snapshots, ai.recall.disallow, ai.click-to-do.disable]
      - name: Serviços de localização
        tweaks: [privacy.location.disable, privacy.find-my-device.disable]
      - name: Comportamento do usuário (experiências personalizadas, rastreamento de apps)
        tweaks: [privacy.telemetry.tailored-experiences, privacy.telemetry.app-launch-tracking]
      - name: Windows Update (P2P, drivers, reinicialização)
        tweaks: [perf.delivery-optimization.http-only, update.exclude-drivers, update.no-auto-restart-logged-on]
      - name: Explorador (anúncios do provedor de sincronização)
        tweaks: [privacy.ads.explorer-sync-provider]
      - name: Microsoft Defender e SpyNet (MAPS, amostras)
        tweaks: [security.defender.disable-cloud-reporting]
      - name: Tela de bloqueio (dicas, Spotlight)
        tweaks: [privacy.ads.lock-screen-tips, privacy.ads.spotlight]
      - name: Dispositivos móveis (Vincular ao Celular)
        tweaks: [apps.remove.phone-link]
      - name: Barra de tarefas (Widgets, Chat)
        tweaks: [ui.taskbar.disable-widgets, ui.taskbar.hide-chat]
      - name: Diversos (feedback, mapas offline)
        tweaks: [privacy.telemetry.feedback-requests, services.maps-broker.disable]

  - name: Wintoys
    url: https://apps.microsoft.com/detail/9P8LTPGCBZXD
    license: proprietária (gratuita, Microsoft Store; Bogdan Pătrăucean)
    version: "atualização de 22/08/2026, segundo a ficha da Microsoft Store"
    note: >
      Recursos tirados da ficha oficial da Microsoft Store. Ignoramos a organização "Wintoys-Performance-Settings"
      do GitHub, que não é do desenvolvedor. Vários recursos (limpeza, reparo, informações do hardware) não são
      ajustes e ficam fora do escopo de um catálogo de tweaks.
    features:
      - name: Ajustes de desempenho (incluindo para jogos)
        tweaks: [perf.game-dvr.disable, gaming.hags.enable, power.plan.high-performance, power.throttling.disable, services.sysmain.disable]
      - name: Configurações ocultas do sistema
        tweaks: [ui.explorer.classic-context-menu, ui.taskbar.end-task, system.long-paths.enable]
      - name: Limpeza de disco
        tweaks: []
        note: Fora do escopo (não é um ajuste reversível). Candidato a ferramenta à parte.
      - name: Ferramentas de reparo (SFC, DISM, CHKDSK)
        tweaks: []
        note: Fora do escopo.
      - name: Anúncios e privacidade
        tweaks: [privacy.ads.tips-suggestions, privacy.ads.start-suggestions, privacy.telemetry.allow-telemetry, privacy.ads.advertising-id]
      - name: Personalização da área de trabalho
        tweaks: [ui.theme.dark-mode, ui.desktop.show-this-pc, ui.taskbar.align-left]
      - name: Desinstalar qualquer app (inclusive os sem opção de desinstalar)
        tweaks: [apps.remove.bing-news, edge.remove, apps.onedrive.uninstall, ai.copilot.remove-app]
        note: Só a lista curada do catálogo, não "qualquer app".
      - name: Desativar serviços desnecessários
        tweaks: [services.xbox.disable, services.fax.disable, services.maps-broker.disable, privacy.telemetry.diagtrack-service]
      - name: Informações do hardware em tempo real
        tweaks: []
        note: Fora do escopo.

  - name: Microsoft PC Manager
    url: https://pcmanager.microsoft.com/en-us
    license: proprietária (gratuita, Microsoft)
    version: "página oficial lida em 17/10/2026 (sem número de versão)"
    note: Ferramenta de manutenção da própria Microsoft; quase nada dela é ajuste de configuração.
    features:
      - name: 'Otimizar ("Boost": liberar memória e arquivos temporários)'
        tweaks: []
        note: Ação pontual, não ajuste; fora do escopo.
      - name: Gerenciamento de armazenamento (arquivos grandes, Sensor de Armazenamento)
        tweaks: []
        note: Fora do escopo; o Sensor de Armazenamento pode virar tweak futuro.
      - name: Controle de pop-ups (anúncios e notificações de apps)
        tweaks: [privacy.ads.tips-suggestions, privacy.ads.settings-suggestions, privacy.ads.account-notifications]
      - name: Verificação de saúde (problemas e ameaças)
        tweaks: []
        note: Fora do escopo.
      - name: Caixa de ferramentas e mini barra
        tweaks: []
        note: Fora do escopo.

  - name: NTLite
    url: https://www.ntlite.com/features/
    license: proprietária (gratuita e paga)
    version: "página de recursos lida em 17/10/2026"
    note: >
      O NTLite edita principalmente imagens (WIM/ESD/ISO) antes da instalação, além do Windows em execução. Só a
      parte de "Configurações e ajustes" e "Serviços" é comparável hoje; o resto vira backlog do modo ISO offline.
    features:
      - name: Ajustes de privacidade e telemetria
        tweaks: [privacy.telemetry.allow-telemetry, privacy.telemetry.diagtrack-service, privacy.telemetry.limit-diagnostics]
      - name: Copilot e IA (inclusive no Edge)
        tweaks: [ai.copilot.remove-app, ai.recall.disallow, edge.disable-ai-features]
      - name: Desempenho e interface
        tweaks: [perf.background-apps.deny, ui.visual.disable-window-animations, ui.explorer.show-file-extensions]
      - name: Endurecimento de segurança, rede e firewall
        tweaks: [network.llmnr.disable, network.netbios.disable-resolution, ui.explorer.disable-autorun-policy]
        note: Cobertura parcial; regras de firewall não estão no catálogo.
      - name: Tipo de inicialização de serviços
        tweaks: [services.sysmain.disable, services.xbox.disable, privacy.telemetry.wer-service]
      - name: Recursos opcionais e recursos sob demanda
        tweaks: [features.smb1.disable, features.work-folders.disable, features.media-player-legacy.disable]
    backlog:
      - Remoção de componentes do Windows na imagem (mais de 500, com análise de dependências)
      - Integração de atualizações cumulativas e de definições do Defender na imagem
      - Integração de drivers (INF) na imagem
      - Instalação autônoma (OOBE, contas locais, regiões, particionamento)
      - Scripts e instaladores pós-instalação
      - Conversão WIM/ESD/ISO e remoção de edições
