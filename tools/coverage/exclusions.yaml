# Items that other tools change and that the catalog will NOT include, with the reason.
# "match" is a regular expression over "<Type>:<target>", e.g. "Registry:HKLM\SYSTEM\...\Value", "Service:UCPD".
# Types: Registry, RegistryKey, Service, Task, Appx, Feature, Capability. Case-insensitive.
items:
  - match: '\\Tcpip\\Parameters\\Interfaces\\.*\\(TcpAckFrequency|TCPNoDelay|TcpDelAckTicks)$|\\MSMQ\\Parameters\\TCPNoDelay$'
    reason: >
      Placebo ("disable Nagle's algorithm"): only affects TCP connections that do not set TCP_NODELAY; games use UDP
      or already disable Nagle on their own socket. No documented measurable gain.
  - match: '\\Multimedia\\SystemProfile\\(NetworkThrottlingIndex|SystemResponsiveness)$|\\Multimedia\\SystemProfile\\Tasks\\'
    reason: >
      MMCSS tweaks sold as "lower latency in games": they only apply to programs that register with MMCSS
      (professional audio) and have no proven gain; NetworkThrottlingIndex only throttled the network during playback.
  - match: '\\PriorityControl\\Win32PrioritySeparation$'
    reason: >
      The Windows client default already favors the foreground program; the "optimized" values that circulate have
      no documented measurable gain.
  - match: '\\Control\\SvcHostSplitThresholdInKB$'
    reason: >
      Only groups services into fewer svchost processes: saves little memory and reduces isolation between services
      (one failure brings down several). Not debloat.
  - match: '\\Memory Management\\(LargeSystemCache|DisablePagingExecutive)$'
    reason: Performance myth for desktop PCs; current Windows manages this better on its own, and it can reduce available memory.
  - match: '\\Memory Management\\FeatureSettingsOverride(Mask)?$|\\Session Manager\\kernel\\DisableExceptionChainValidation$|\\Virtualization\\MinVmVersionForCpuBasedMitigations$'
    reason: >
      Turns off processor (Spectre/Meltdown) or kernel (SEHOP) security mitigations. Out of scope: the
      program does not reduce system security protections for performance.
  - match: '\\DeviceGuard\\(EnableVirtualizationBasedSecurity|RequirePlatformSecurityFeatures|Locked)$|\\HypervisorEnforcedCodeIntegrity\\|\\CI\\Policy\\VerifiedAndReputablePolicyState$'
    reason: >
      VBS/HVCI and Smart App Control are kernel protections; turning them off is a security decision,
      not "debloating". Out of scope for now.
  - match: '^Service:UCPD$|UCPD velocity'
    reason: >
      UCPD protects file associations and some taskbar values against programs that change them.
      The program does not turn off or bypass system protections.
  - match: '^Service:GpuEnergyDrv$'
    reason: System driver (GPU power); disabling drivers brings no proven gain and can break Task Manager.
  - match: '\\(OEMInformation|CurrentVersion)\\(Manufacturer|Model|SupportURL|SupportPhone|SupportHours|Logo|RegisteredOrganization|RegisteredOwner)$'
    reason: Brand/OEM customization of the playbook itself; not a Windows tweak.
  - match: '\\(BraveSoftware|NVIDIA Corporation|Mozilla|Google\\Chrome|Adobe)\\'
    reason: Configures third-party programs; outside the catalog's scope (only Windows and Microsoft apps).
  - match: '^Registry(Key)?:HKCR\\WindowsCleanup'
    reason: Protocol registered by Sophia Script itself for its own task; not a Windows tweak.
  - match: '\\Keyboard Layout\\Scancode Map$'
    reason: Key remapping (personal preference); out of scope.
  - match: '\\GameConfigStore\\GameDVR_(FSEBehaviorMode|FSEBehavior|HonorUserFSEBehaviorMode|DXGIHonorFSEWindowsCompatible|EFSEFeatureFlags)$'
    reason: >
      "Disable fullscreen optimizations": disputed effect; on Windows 11 the flip presentation model is usually
      equal to or better than exclusive fullscreen. Not included for lack of proven gain.
  - match: '\\GameBar\\(AutoGameModeEnabled|AllowAutoGameMode)$'
    reason: Game Mode on is the default and does not hurt performance; turning it on/off is not debloat.
  - match: '\\Schedule\\Maintenance\\MaintenanceDisabled$'
    reason: >
      Turns off automatic maintenance entirely (drive optimization/TRIM, disk checks, cleanup); it does more
      harm than good. Specific tasks are handled one by one in the catalog.
  - match: '\\Tcpip6\\Parameters\\DisabledComponents$|\\TCPIP\\v6Transition\\|Teredo'
    reason: >
      Turning off IPv6/Teredo does not improve performance and breaks features (Xbox Live, HomeGroup, some VPNs);
      Microsoft advises against disabling IPv6.
  - match: '^Appx:(Microsoft\.WindowsStore|Microsoft\.DesktopAppInstaller|Microsoft\.WindowsNotepad|Microsoft\.WindowsTerminal|Microsoft\.WindowsCalculator|Microsoft\.Windows\.Photos|Microsoft\.StorePurchaseApp|Microsoft\.SecHealthUI)$'
    reason: >
      Essential apps kept on purpose (Store, winget/App Installer, Notepad, Terminal,
      Calculator, Photos, Windows Security): removing them breaks app installation/updates or basic functions.
  - match: '\\Explorer\\Advanced\\TaskbarDa$|\\Policies\\Microsoft\\Dsh\\AllowNewsAndInterests$'
    reason: >
      On 26300 Windows denies writes to these values (UCPD driver protection). The catalog uses the
      DisableWidgetsBoard policy (ui.taskbar.disable-widgets) and does not bypass the protection (see the VM test results).
