name: Reference check

# Weekly: re-downloads the Policy CSP documentation (Microsoft Learn), regenerates
# reference/msdocs-policy-csp.json and runs 'validate --reference' before and after. If the reference
# changed or new warnings appeared, opens (or comments on) an issue with the summary. The new JSON is
# uploaded as an artifact for the maintainer to review and commit (the workflow has read-only access to the code).
# The Markdown summary only goes into the issue body and the run artifact; nothing is written to a docs path.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: reference-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    env:
      CLI: src/Debloater.Cli
      REFGEN: tools/Debloater.RefGen
      CSP: reference/msdocs-policy-csp.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Debloater.slnx -c Release

      # "Before" and "after" run on the SAME runner (same ADMX in C:\Windows\PolicyDefinitions),
      # so any difference between them comes only from the Microsoft documentation.
      # The comparison relies on the --warnings-out file (one finding per line, warnings prefixed
      # with "WARN "), not on the CLI's console text.
      - name: Validate with the committed reference (before)
        shell: pwsh
        run: |
          Copy-Item $env:CSP "$env:RUNNER_TEMP/old-csp.json"
          dotnet run --project $env:CLI -c Release --no-build -- validate --reference --csp "$env:RUNNER_TEMP/old-csp.json" --warnings-out "$env:RUNNER_TEMP/before.txt"

      - name: Regenerate the Policy CSP reference
        shell: pwsh
        run: dotnet run --project $env:REFGEN -c Release --no-build -- --out $env:CSP

      - name: Validate with the new reference (after)
        shell: pwsh
        run: |
          dotnet run --project $env:CLI -c Release --no-build -- validate --reference --verbose --csp $env:CSP --warnings-out "$env:RUNNER_TEMP/after.txt" |
            Tee-Object -FilePath "$env:RUNNER_TEMP/validate.log"

      - name: Compare
        id: compare
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          dotnet run --project $env:REFGEN -c Release --no-build -- compare "$t/old-csp.json" $env:CSP --markdown "$t/csp-diff.md"
          $refChanged = $LASTEXITCODE -ne 0
          $global:LASTEXITCODE = 0

          $before = @(Get-Content "$t/before.txt")
          $after = @(Get-Content "$t/after.txt")
          $newWarnings = @($after | Where-Object { $_ -like 'WARN *' -and $before -notcontains $_ })
          $goneWarnings = @($before | Where-Object { $_ -like 'WARN *' -and $after -notcontains $_ })
          $allWarnings = @($after | Where-Object { $_ -like 'WARN *' })

          $body = New-Object System.Text.StringBuilder
          [void]$body.AppendLine("Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          [void]$body.AppendLine("")
          if ($refChanged) {
            [void]$body.AppendLine("## The Policy CSP documentation changed")
            [void]$body.AppendLine("")
            [void]$body.AppendLine((Get-Content "$t/csp-diff.md" -Raw))
            [void]$body.AppendLine("Download the **msdocs-policy-csp** artifact from this run, review it and commit it to ``reference/msdocs-policy-csp.json`` (or run ``dotnet run --project tools/Debloater.RefGen`` locally).")
            [void]$body.AppendLine("")
          }
          if ($newWarnings.Count -gt 0) {
            [void]$body.AppendLine("## New validate --reference warnings ($($newWarnings.Count))")
            [void]$body.AppendLine("")
            foreach ($w in $newWarnings) { [void]$body.AppendLine("- $w") }
            [void]$body.AppendLine("")
          }
          if ($goneWarnings.Count -gt 0) {
            [void]$body.AppendLine("## Warnings no longer reported ($($goneWarnings.Count))")
            [void]$body.AppendLine("")
            foreach ($w in $goneWarnings) { [void]$body.AppendLine("- $w") }
            [void]$body.AppendLine("")
          }
          [void]$body.AppendLine("<details><summary>All current warnings ($($allWarnings.Count))</summary>")
          [void]$body.AppendLine("")
          foreach ($w in $allWarnings) { [void]$body.AppendLine("- $w") }
          [void]$body.AppendLine("")
          [void]$body.AppendLine("</details>")

          $text = $body.ToString()
          if ($text.Length -gt 60000) { $text = $text.Substring(0, 60000) + "`n`n… (truncated; see the run log)" }
          Set-Content -Path "$t/issue.md" -Value $text -Encoding utf8

          $notify = $refChanged -or $newWarnings.Count -gt 0
          "notify=$($notify.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Reference changed: $refChanged | new warnings: $($newWarnings.Count) | current warnings: $($allWarnings.Count)"

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msdocs-policy-csp
          path: |
            reference/msdocs-policy-csp.json
            ${{ runner.temp }}/validate.log
            ${{ runner.temp }}/csp-diff.md
            ${{ runner.temp }}/after.txt
            ${{ runner.temp }}/issue.md
          if-no-files-found: ignore

      - name: Open or update the issue
        if: steps.compare.outputs.notify == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $label = "reference-check"
          gh label create $label --color FBCA04 --description "Changes in the reference documentation/ADMX" --force | Out-Null
          $existing = gh issue list --label $label --state open --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment $existing --body-file "$env:RUNNER_TEMP/issue.md"
            "Commented on issue #$existing."
          } else {
            $title = "References: changes in the Microsoft documentation ($(Get-Date -Format 'yyyy-MM-dd'))"
            gh issue create --title $title --label $label --body-file "$env:RUNNER_TEMP/issue.md"
          }
