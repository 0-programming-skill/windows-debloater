name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Debloater.slnx -c Release

      - name: Test
        run: dotnet test Debloater.slnx -c Release --no-build

      - name: Validate the catalog
        run: dotnet run --project src/Debloater.Cli -c Release --no-build -- validate

      # Reference warnings do not fail CI; they stay in the log for review.
      - name: Validate against the references (runner ADMX + Policy CSP)
        run: dotnet run --project src/Debloater.Cli -c Release --no-build -- validate --reference
